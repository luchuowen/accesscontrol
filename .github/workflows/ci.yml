name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: lango, POSTGRES_PASSWORD: lango, POSTGRES_DB: lango_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=lango psql -h localhost -U lango -d lango_test -c "CREATE ROLE lango_app LOGIN PASSWORD 'lango_app'"
      - run: bash scripts/factory-check.sh full
